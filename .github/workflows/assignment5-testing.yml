
name: Assignment 5 Automated Testing

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/assignment5-testing.yml'
      - 'test/**'
      - 'src/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bunx --no-install ncc build src/index.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/
          if-no-files-found: error

  test-unit:
    name: Unit Tests and Coverage
    needs: build
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Run unit tests
        run: npm run test:unit

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage \
            --test-reporter=spec \
            --test-reporter-destination=coverage/results.txt \
            test/unit/*.test.mjs
          cat coverage/results.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  test-integration:
    name: Integration Tests
    needs: test-unit
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run integration tests
        run: npm run test:integration


  deploy-staging:
  
    name: Deploy to Staging
    needs: test-integration
    runs-on: ubuntu-latest
    environment: staging
    env:
      TEST_ENV: staging
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Verify staging artifact
        run: |
          echo "Deploying to staging..."
          test -s dist/index.js
          echo "Staging verification successful."

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      TEST_ENV: prod
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Verify production artifact
        run: |
          echo "Production deployment approved."
          test -s dist/index.js
          echo "Production artifact verification successful."

