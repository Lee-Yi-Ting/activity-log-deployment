name: Assignment 4 Deployment Pipeline
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assignment4-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check JavaScript syntax before build
        run: find src -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build action bundle
        run: bunx --no-install ncc build src/index.js --license licenses.txt
      - name: Verify action entrypoint and package release
        run: |
          test -s dist/index.js
          zip -r build.zip dist action.yml LICENSE
          sha256sum build.zip > build.zip.sha256
      - name: Dynamic version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: echo "version=1.0.${RUN_NUMBER}-attempt.${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            build.zip
            build.zip.sha256
          if-no-files-found: error
  deploy-dev:
    needs: [build]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
      - name: Verify artifact checksum
        run: sha256sum -c build.zip.sha256
      - name: Validate environment variables
        env:
          BUILD_TAG: ${{ vars.BUILD_TAG }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          test -n "$BUILD_TAG"
          test -n "$RELEASE_NOTE"
      - name: Publish dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_TAG: ${{ vars.BUILD_TAG }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          set -euo pipefail
          TAG="dev-v$VERSION"
          printf '%s\n\nBUILD_TAG: %s\nCommit: %s\n' "$RELEASE_NOTE" "$BUILD_TAG" "$TARGET_SHA" > notes.md
          gh release create "$TAG" build.zip build.zip.sha256 --target "$TARGET_SHA" --title "$TAG" --notes-file notes.md --prerelease
          printf '### Published release\n%s\n' "$TAG" >> "$GITHUB_STEP_SUMMARY"
  deploy-staging:
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
      - name: Verify artifact checksum
        run: sha256sum -c build.zip.sha256
      - name: Validate environment variables
        env:
          BUILD_TAG: ${{ vars.BUILD_TAG }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          test -n "$BUILD_TAG"
          test -n "$RELEASE_NOTE"
      - name: Publish staging release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_TAG: ${{ vars.BUILD_TAG }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          set -euo pipefail
          TAG="staging-v$VERSION"
          printf '%s\n\nBUILD_TAG: %s\nCommit: %s\n' "$RELEASE_NOTE" "$BUILD_TAG" "$TARGET_SHA" > notes.md
          gh release create "$TAG" build.zip build.zip.sha256 --target "$TARGET_SHA" --title "$TAG" --notes-file notes.md --prerelease
          printf '### Published release\n%s\n' "$TAG" >> "$GITHUB_STEP_SUMMARY"
  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
      - name: Verify artifact checksum
        run: sha256sum -c build.zip.sha256
      - name: Validate environment variables
        env:
          BUILD_TAG: ${{ vars.BUILD_TAG }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          test -n "$BUILD_TAG"
          test -n "$RELEASE_NOTE"
      - name: Publish production release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_TAG: ${{ vars.BUILD_TAG }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          set -euo pipefail
          TAG="prod-v$VERSION"
          printf '%s\n\nBUILD_TAG: %s\nCommit: %s\n' "$RELEASE_NOTE" "$BUILD_TAG" "$TARGET_SHA" > notes.md
          gh release create "$TAG" build.zip build.zip.sha256 --target "$TARGET_SHA" --title "$TAG" --notes-file notes.md --latest
          printf '### Published release\n%s\n' "$TAG" >> "$GITHUB_STEP_SUMMARY"

